<body>
  <div id="app">
    <div class="bg" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>

    <main id="views"></main>

    <nav class="tabbar glass" aria-label="Розділи">
      <div class="brand" aria-hidden="true"><img src="/icons/icon-192.png" alt=""><span><b>Звички</b><small>і план на день</small></span></div>
      <div class="tab-indicator" aria-hidden="true"></div>
      <button class="tab" data-tab="today" aria-label="Звички">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>
        <span>Звички</span>
      </button>
      <button class="tab" data-tab="plan" aria-label="План">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11"/><circle cx="5" cy="18" r="1.3"/></svg>
        <span>План</span>
      </button>
      <button class="tab" data-tab="journal" aria-label="Щоденник">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11M9 8.5h6"/></svg>
        <span>Щоденник</span>
      </button>
      <button class="tab" data-tab="table" aria-label="Таблиця">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9.5h17M9.5 3.5v17"/></svg>
        <span>Таблиця</span>
      </button>
      <button class="tab" data-tab="stats" aria-label="Статистика">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
        <span>Статистика</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="fx" aria-hidden="true"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
