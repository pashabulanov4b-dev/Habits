name: Нагадування про звички

# GitHub запускає це приблизно кожні 15 хвилин (безкоштовно).
# Потрібні секрети репозиторію: APP_URL (напр. https://habits.vercel.app) і CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Надіслати нагадування, кому вже час
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
